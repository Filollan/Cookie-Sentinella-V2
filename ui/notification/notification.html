<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Notificaciones - CookieSentinella</title>
  <link rel="stylesheet" href="../components/shared/styles.css" />
  <link rel="stylesheet" href="./notification.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  
  <!-- Header dinámico -->
  <div id="layout-header"></div>

  <!-- Contenido principal -->
  <div class="popup-container notification-container">
    <h4>Notificaciones</h4>
    
    <!-- Tarjeta: Cookies protegidas -->
    <div class="notification-card">
      <div class="notification-icon" data-lucide-icon="ShieldCheck"></div>
      <div class="notification-text">
        <h2 id="protectedCookiesCount">0</h2>
        <p>Cookies protegidas</p>
      </div>
    </div>

    <!-- Tarjeta: Intentos de XSS -->
    <div class="notification-card">
      <div class="notification-icon" data-lucide-icon="ShieldAlert"></div>
      <div class="notification-text">
        <h2 id="xssAttemptsCount">0</h2>
        <p>Intentos de XSS</p>
      </div>
    </div>

    <!-- Tarjeta: Cambios de fingerprint -->
    <div class="notification-card">
      <div class="notification-icon" data-lucide-icon="Fingerprint"></div>
      <div class="notification-text">
        <h2 id="fingerprintChangesCount">0</h2>
        <p>Cambios de fingerprint</p>
      </div>
    </div>

    <!-- Tarjeta: Intentos de exportación -->
    <div class="notification-card">
      <div class="notification-icon" data-lucide-icon="ArrowUpRight"></div>
      <div class="notification-text">
        <h2 id="exportAttemptsCount">0</h2>
        <p>Intentos de exportación</p>
      </div>
    </div>

    <!-- Tarjeta: Patrones de amenaza -->
    <div class="notification-card">
      <div class="notification-icon" data-lucide-icon="Brain"></div>
      <div class="notification-text">
        <h2 id="threatAlertsCount">0</h2>
        <p>Patrones de amenaza detectados</p>
      </div>
    </div>

    <!-- Sección de patrones activos -->
    <div id="activePatternsSection" class="patterns-section">
      <h5>Patrones activos</h5>
      <div id="activePatternsList" class="patterns-list"></div>
    </div>
  </div>

  <!-- Footer dinámico -->
  <div id="layout-footer"></div>

  <!-- JS principal -->
  <script type="module" src="notification.js"></script>
</body>
</html>
