<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Notificaciones - CookieSentinella</title>
  <link rel="stylesheet" href="../components/shared/styles.css" />
  <link rel="stylesheet" href="./notification.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  
  <!-- Header dinámico -->
  <div id="layout-header"></div>

  <!-- Contenido principal -->
  <div class="popup-container notification-container">
    <h4>Notificaciones</h4>
    
    <!-- Tarjeta: Cookies protegidas -->
    <div class="notification-card">
      <div class="notification-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="10 19 12 21 16 17"></polyline>
        </svg>
      </div>
      <div class="notification-text">
        <h2 id="protectedCookiesCount">0</h2>
        <p>Cookies protegidas</p>
      </div>
    </div>

    <!-- Tarjeta: Intentos de XSS -->
    <div class="notification-card">
      <div class="notification-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="notification-text">
        <h2 id="xssAttemptsCount">0</h2>
        <p>Intentos de XSS</p>
      </div>
    </div>

    <!-- Tarjeta: Cambios de fingerprint -->
    <div class="notification-card">
      <div class="notification-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 4c-3.3 0-6.2 1.5-8.1 3.8m16.2 0C18.2 5.5 15.3 4 12 4"></path>
          <path d="M12 20c3.3 0 6.2-1.5 8.1-3.8m-16.2 0C5.8 18.5 8.7 20 12 20"></path>
          <path d="M8 12h8"></path>
          <circle cx="12" cy="12" r="1"></circle>
        </svg>
      </div>
      <div class="notification-text">
        <h2 id="fingerprintChangesCount">0</h2>
        <p>Cambios de fingerprint</p>
      </div>
    </div>

    <!-- Tarjeta: Intentos de exportación -->
    <div class="notification-card">
      <div class="notification-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon">
          <line x1="17" y1="7" x2="17" y2="17"></line>
          <polyline points="12 2 17 7 12 12"></polyline>
          <path d="M12 17H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"></path>
        </svg>
      </div>
      <div class="notification-text">
        <h2 id="exportAttemptsCount">0</h2>
        <p>Intentos de exportación</p>
      </div>
    </div>

    <!-- Tarjeta: Patrones de amenaza -->
    <div class="notification-card">
      <div class="notification-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon">
          <path d="M9.59 4.59A2 2 0 1 0 8 2.5a2 2 0 0 0 1.59 2.09z"></path>
          <path d="M16.41 4.59A2 2 0 1 0 15 2.5a2 2 0 0 0 1.41 2.09z"></path>
          <path d="M12 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
          <path d="M12 20v-2"></path>
          <path d="M6 17a2 2 0 0 0-2 2v1"></path>
          <path d="M20 17a2 2 0 0 0-2 2v1"></path>
        </svg>
      </div>
      <div class="notification-text">
        <h2 id="threatAlertsCount">0</h2>
        <p>Patrones de amenaza detectados</p>
      </div>
    </div>

    <!-- Sección de patrones activos -->
    <div id="activePatternsSection" class="patterns-section">
      <h5>Patrones activos</h5>
      <div id="activePatternsList" class="patterns-list"></div>
    </div>
  </div>

  <!-- Footer dinámico -->
  <div id="layout-footer"></div>

  <!-- JS principal -->
  <script type="module" src="notification.js"></script>
</body>
</html>
